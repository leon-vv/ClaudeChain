<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClaudeChain</title>
  <script>
    // Set the theme before the stylesheet applies, so the page never flashes the wrong one.
    (() => {
      let t = null;
      try { t = localStorage.getItem("claudechain-theme"); } catch {}
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>ClaudeChain</h1>
      <button id="btn-add" class="primary">+ Add issue</button>
      <nav class="pages" id="pages">
        <button data-page="board" class="active">Board</button>
        <button data-page="resources">Resources</button>
      </nav>
      <button class="repo" id="repo" title="Open another repository">📁 <span id="repo-path">no repository</span></button>
    </div>
    <div class="actions">
      <button class="plan" id="plan" title="Plan usage reported by Claude Code" hidden></button>
      <button id="btn-theme"title="Toggle dark mode" aria-label="Toggle dark mode"></button>
      <span class="conn" id="conn" title="Live connection to the server"><span class="dot">●</span> Server</span>
    </div>
  </header>

  <main class="resources" id="resources-page" hidden></main>

  <main class="board-wrap" id="board-page">
    <table class="board" id="board"></table>
    <div class="landing" id="no-repo" hidden>
      <h1>ClaudeChain</h1>
      <p>No repository is open.</p>
      <button class="primary" id="btn-open-repo">📁 Select repository</button>
    </div>
    <p class="empty" id="empty" hidden>No work items yet. Use <b>+ Add issue</b> to paste a GitHub issue URL, <code>#123</code>, or issue text.</p>
  </main>

  <aside class="inspector" id="inspector" hidden>
    <div class="insp-resizer" id="insp-resizer" title="Drag to resize · double-click to reset" aria-hidden="true"></div>
    <div class="insp-head">
      <button id="insp-close" class="close" title="Close (Esc)" aria-label="Close">✕ Close</button>
      <div class="insp-title">
        <div id="insp-item"></div>
        <div class="insp-meta" id="insp-meta"></div>
      </div>
      <div class="insp-controls">
        <select id="insp-run" title="Runs of this item"></select>
        <button id="insp-stop">Stop</button>
        <button id="insp-retry">Retry step</button>
        <button id="insp-move">Move…</button>
        <button id="insp-remove" class="danger">Remove</button>
      </div>
    </div>
    <nav class="tabs" id="insp-tabs">
      <button data-tab="transcript">Transcript</button>
      <button data-tab="input">Input</button>
      <button data-tab="output">Output</button>
      <button data-tab="files" title="All files in this work item's folder (.claudechain/items/&lt;id&gt;/): the issue, the messages agents pass to each other, and per-run logs. Not the code; see Diff.">Files</button>
      <button data-tab="diff">Diff</button>
    </nav>
    <section class="insp-body" id="insp-body"></section>
    <form class="composer" id="composer">
      <textarea id="composer-text" rows="2" placeholder="Give this agent extra direction…"></textarea>
      <div class="composer-actions" id="composer-actions"></div>
    </form>
  </aside>

  <dialog id="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <p class="error" id="dialog-error"></p>
      <div class="dialog-actions">
        <button type="button" id="dialog-cancel">Cancel</button>
        <button value="ok" class="primary" id="dialog-ok">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
  <script src="/resources.js"></script>
</body>
</html>

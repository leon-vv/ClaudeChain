# ClaudeChain pipeline. Prompts live in prompts/general.md and prompts/<id>.md.
# Model, workers and approval can also be changed from the web UI.
# Optional per step: effort = "low" | "medium" | "high" | "xhigh" | "max"
# (passed to `claude --effort`; omit it to use Claude's default).

# Maximum number of backward moves (e.g. Build/Test -> Implementation) per item
# before it is handed to a human.
max_iterations = 6

# OpenAI models (gpt-*, o3, ...) run through the Codex CLI instead of Claude Code.
models = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5", "claude-fable-5-1", "gpt-6.2-sol", "gpt-6.2-astra", "gpt-6-luna"]

[[step]]
id = "triage"
name = "Triage & Context"
model = "claude-haiku-5-5"
max_workers = 2
allowed_targets = ["next", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write"]

[[step]]
id = "implementation"
name = "Implementation"
model = "claude-opus-5-5"
max_workers = 3
allowed_targets = ["next", "triage", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write", "Edit"]

[[step]]
id = "build_test"
name = "Build & test"
model = "claude-haiku-5-5"
max_workers = 1
allowed_targets = ["next", "implementation", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write"]

[[step]]
id = "pull_request"
name = "Pull request"
model = "claude-haiku-5-5"
max_workers = 1
require_approval = true
allowed_targets = ["next", "implementation", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write"]

# The agent behind the "Fix conflicts" button next to an item's PR link. It
# merges the main branch into the item's branch, resolves conflicts and pushes
# to the PR. Its prompt is prompts/merge_conflict.md.
[conflicts]
model = "claude-sonnet-5-5"
# effort = "high"
tools = ["Read", "Grep", "Glob", "Bash", "Write", "Edit"]

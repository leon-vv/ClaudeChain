# ClaudeChain pipeline. Prompts live in prompts/general.md and prompts/<id>.md.
# Model, workers and approval can also be changed from the web UI.

# Maximum number of backward moves (e.g. Build/Test -> Implementation) per item
# before it is handed to a human.
max_iterations = 6

models = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5", "claude-fable-5-1"]

[[step]]
id = "triage"
name = "Triage"
model = "claude-haiku-5-5"
max_workers = 2
allowed_targets = ["next", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write"]

[[step]]
id = "breakdown"
name = "Work breakdown"
model = "claude-opus-5-5"
max_workers = 2
allowed_targets = ["next", "triage", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write"]

[[step]]
id = "implementation"
name = "Implementation"
model = "claude-sonnet-5-5"
max_workers = 3
allowed_targets = ["next", "breakdown", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write", "Edit"]

[[step]]
id = "build_test"
name = "Build & test"
model = "claude-sonnet-5-5"
max_workers = 1
allowed_targets = ["next", "implementation", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write"]

[[step]]
id = "review"
name = "Review"
model = "claude-opus-5-5"
max_workers = 2
allowed_targets = ["next", "implementation", "breakdown", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write"]

[[step]]
id = "pull_request"
name = "Pull request"
model = "claude-haiku-5-5"
max_workers = 1
require_approval = true
allowed_targets = ["next", "implementation", "human"]
tools = ["Read", "Grep", "Glob", "Bash", "Write"]
